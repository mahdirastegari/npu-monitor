# npu-monitord configuration file.
#
# Lines are key=value. Comments start with # or ;.
# All values have sensible defaults; this file overrides them.

# --- Collection intervals (milliseconds) ---
# Utilization and device memory: every 1 second.
utilization_interval_ms=1000
# Temperature, power, and clocks: every 2 seconds.
env_interval_ms=2000
# Process/device-memory attribution: every 2 seconds.
process_interval_ms=2000
# PCIe profiling: disabled by default. Set to 5000-10000 to enable.
pcie_interval_ms=0

# --- Collector tuning ---
# Number of threads for aicore utilization collection. 1 is recommended;
# the MCU round-trip (~64 ms per device) is the bottleneck.
utilization_workers=1
# Mark readings as stale after this many milliseconds without an update.
stale_after_ms=5000
# Consecutive errors before marking the daemon state as stale.
error_threshold=3
# Sleep after this many milliseconds with no client activity.
# 0 = always active. Default: 2000 (2 seconds).
idle_timeout_ms=2000

# --- Socket server ---
socket_path=/var/run/npu-monitor.sock
max_frame_bytes=4194304
max_subscribers=64

# --- Startup ---
# Maximum time to wait for the first snapshot (milliseconds).
ready_timeout_ms=30000

# --- Logging ---
# One of: debug, info, warn, error.
log_level=info
# Log file path. Empty = stderr (captured by journald).
log_file=
